# Render Blueprint - deploy 1 click cho MAIL REG PRO bot
services:
  - type: web
    name: mail-reg-pro-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python mail_reg_pro.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Dien token bot Telegram cua ban (lay tu @BotFather)
      - key: BOT_TOKEN
        sync: false
      # Khoa bao ve web dashboard (tu sinh, khong can sua)
      - key: DASH_KEY
        generateValue: true
